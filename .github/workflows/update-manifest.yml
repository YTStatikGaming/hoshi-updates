name: Announce published release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-update-manifest
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const stable = releases.filter(r => !r.draft && !r.prerelease && /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(r.tag_name));
            stable.sort((a, b) => {
              const av = a.tag_name.slice(1).split('.').map(BigInt), bv = b.tag_name.slice(1).split('.').map(BigInt);
              for (let i = 0; i < 3; i++) if (av[i] !== bv[i]) return av[i] > bv[i] ? -1 : 1;
              return 0;
            });
            const release = stable[0];
            if (!release) { core.notice('No public stable release to announce.'); return; }
            const version = release.tag_name.slice(1);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id: release.id, per_page: 100 });
            for (const target of ['linux-x64.tar.gz', 'linux-arm64.tar.gz', 'windows-x64.zip', 'macos-arm64.tar.gz']) {
              const archive = `hoshi-${version}-${target}`;
              for (const name of [archive, `${archive}.sha256`]) {
                if (!assets.some(a => a.name === name && a.size > 0 && a.state === 'uploaded')) throw Error(`Release is missing ${name}; update notification is withheld.`);
              }
            }
            const manifest = {
              version,
              releaseUrl: `https://github.com/${owner}/${repo}/releases/tag/${release.tag_name}`,
              notes: `Hoshi ${version} is available. ${String(release.body || 'See the release page for details.').slice(0, 2400)}`,
              publishedAt: release.published_at,
            };
            let sha;
            try {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: 'latest.json', ref: 'main' });
              if (Array.isArray(data) || !data.sha) throw Error('latest.json is not a file');
              if (Buffer.from(data.content || '', 'base64').toString('utf8') === JSON.stringify(manifest, null, 2) + '\n') return;
              sha = data.sha;
            } catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({ owner, repo, path: 'latest.json', branch: 'main', message: `Announce Hoshi ${version}`, content: Buffer.from(JSON.stringify(manifest, null, 2) + '\n').toString('base64'), ...(sha ? { sha } : {}) });
            core.notice(`Update manifest now announces Hoshi ${version}.`);
